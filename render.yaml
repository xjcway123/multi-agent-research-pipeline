services:
  - type: web
    name: multi-agent-research
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LLM_BACKEND
        value: glm
      - key: LLM_BASE_URL
        value: https://open.bigmodel.cn/api/paas/v4
      - key: LLM_MODEL
        value: glm-4-flash
      - key: LLM_API_KEY
        sync: false
